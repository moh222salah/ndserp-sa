name: Deploy to ERPNext server

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # allows manual run from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            SITE="${{ secrets.SITE_NAME }}"
            BENCH="/home/frappe/frappe/frappe-bench"
            sudo -u frappe -H bash -lc "
              set -e
              cd '$BENCH/apps/contracting'
              git fetch origin main
              git reset --hard origin/main
              cd '$BENCH'
              ./env/bin/pip install -e apps/contracting >/dev/null
              bench --site '$SITE' migrate
              bench build --app contracting
              bench --site '$SITE' clear-cache
              bench restart || true
            "
            echo "Deployed contracting to $SITE"
