# Optional defence-in-depth for production deployments of amir_theme_v16.
#
# Paste these blocks inside the site's `server { ... }` block, ABOVE the
# existing `location /assets { ... }`, then `nginx -t && systemctl reload nginx`.
#
# The app is already hardened at the filesystem level: sources live in
# amir_theme_v16/src/ (outside the served tree) and scripts/harden_assets.sh
# deletes every source map after each build. These rules are a safety net for
# the one realistic failure mode — somebody runs `bench build` on the server
# and forgets to run harden_assets.sh afterwards, putting the .map files back.

# 1. Never serve source maps, whatever ends up on disk.
location ~* \.map$ {
    access_log off;
    return 404;
}

# 2. Never serve anything from the source directories, in case a future
#    refactor puts real code back under public/js or public/scss.
#
#    This cannot affect the built bundles: they are served from
#    /assets/amir_theme_v16/dist/js/... and /assets/amir_theme_v16/dist/css/...,
#    where the path segment after the app name is "dist", not "js" or "scss",
#    so the anchored prefix below never matches them.
location ~* ^/assets/amir_theme_v16/(js|scss)/ {
    access_log off;
    return 404;
}
