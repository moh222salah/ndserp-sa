name: Saudi ERP Codespaces Validation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON configuration
        run: |
          python3 - <<'PY'
          import json
          for path in [
              "bench/common_site_config.json",
              ".devcontainer/devcontainer.json",
          ]:
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print(f"JSON_OK={path}")
          PY

      - name: Validate shell scripts
        run: |
          bash -n codespace-bootstrap.sh
          bash -n codespace-runtime-sync.sh
          bash -n codespace-verify-runtime.sh
          bash -n codespace-start-server.sh
          bash -n codespace-install-theme-safe.sh
          bash -n codespace-remove-custom-reports-safe.sh
          bash -n codespace-poststart.sh
          bash -n codespace-apply-quick-actions-ui.sh
          bash -n codespace-quiesce-runtime-sync.sh
          bash -n runtime-refresh.sh
          bash -n apps/amir_theme_v16/scripts/harden_assets.sh
          echo "BASH_SYNTAX=PASS"

      - name: Validate Saudi app source tree
        run: |
          test -f bench/apps.txt
          while IFS= read -r app; do
            [ -z "$app" ] && continue
            test -d "apps/$app"
            echo "APP_SOURCE=PASS:$app"
          done < bench/apps.txt

      - name: Verify warehouse workspace visual isolation and runtime asset guards
        run: |
          test -s apps/amir_theme_v16/amir_theme_v16/src/scss/layouts/_warehouse-workspace.scss
          test -s apps/amir_theme_v16/amir_theme_v16/src/scss/components/_warehouse-dashboard.scss
          test -s apps/amir_theme_v16/amir_theme_v16/src/js/core/warehouse_dashboard.js
          grep -Fq '@import "layouts/warehouse-workspace";' apps/amir_theme_v16/amir_theme_v16/src/scss/amir_theme.bundle.scss
          grep -Fq '@import "components/warehouse-dashboard";' apps/amir_theme_v16/amir_theme_v16/src/scss/amir_theme.bundle.scss
          grep -Fq 'import { warehouseDashboard } from "./core/warehouse_dashboard.js";' apps/amir_theme_v16/amir_theme_v16/src/js/amir_theme.bundle.js
          grep -Fq 'warehouseDashboard.mount();' apps/amir_theme_v16/amir_theme_v16/src/js/amir_theme.bundle.js
          grep -Fq 'function syncWarehouseWorkspaceScope()' apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js
          grep -Fq 'document.documentElement.classList.toggle("nds-warehouse-workspace", Boolean(active))' apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js
          grep -Fq 'WAREHOUSE_WORKSPACE_CSS=PASS' codespace-runtime-sync.sh
          grep -Fq 'WAREHOUSE_WORKSPACE_JS=PASS' codespace-runtime-sync.sh
          grep -Fq 'SERVED_WAREHOUSE_WORKSPACE_CSS=PASS' codespace-verify-runtime.sh
          grep -Fq 'SERVED_WAREHOUSE_WORKSPACE_JS=PASS' codespace-verify-runtime.sh
          grep -Fq 'nds-warehouse-dashboard' codespace-runtime-sync.sh
          grep -Fq 'nds-warehouse-dashboard' codespace-verify-runtime.sh
          python3 - <<'PY'
          from pathlib import Path
          css = Path("apps/amir_theme_v16/amir_theme_v16/src/scss/layouts/_warehouse-workspace.scss").read_text(encoding="utf-8")
          dashboard_css = Path("apps/amir_theme_v16/amir_theme_v16/src/scss/components/_warehouse-dashboard.scss").read_text(encoding="utf-8")
          dashboard_js = Path("apps/amir_theme_v16/amir_theme_v16/src/js/core/warehouse_dashboard.js").read_text(encoding="utf-8")
          entry_js = Path("apps/amir_theme_v16/amir_theme_v16/src/js/amir_theme.bundle.js").read_text(encoding="utf-8")
          js = Path("apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js").read_text(encoding="utf-8")
          # Only the named workspace receives these layout rules.
          assert 'html.nds-warehouse-workspace [data-page-route="Workspaces"]' in css
          assert 'currentWorkspaceKey() === "مخازن NDS ERP"' in js
          assert "number-widget-box" in css and "dashboard-widget-box" in css
          assert "shortcut-widget-box" in css and "links-widget-box" in css
          for marker in (".nds-warehouse-dashboard", ".nds-warehouse-kpi-grid", ".nds-warehouse-movement-chart", ".nds-warehouse-distribution-chart", ".nds-warehouse-shortage-table", "grid-template-columns:repeat(4,minmax(0,1fr))"):
              assert marker in dashboard_css.replace(" ", ""), f"Missing warehouse dashboard CSS marker: {marker}"
          for marker in ("nds-warehouse-dashboard", "nds-warehouse-kpi-grid", "nds-warehouse-movement-chart", "nds-warehouse-distribution-chart", "nds-warehouse-shortage-table", "Stock Ledger Entry", "frappe.client.get_list"):
              assert marker in dashboard_js, f"Missing warehouse dashboard JS marker: {marker}"
          assert "warehouseDashboard.mount();" in entry_js
          assert "getMovement(company,end)" in dashboard_js
          assert "getShortages(company)" in dashboard_js
          print("WAREHOUSE_WORKSPACE_SOURCE_SCOPE=PASS")
          print("WAREHOUSE_DASHBOARD_LIVE_DATA_SOURCE=PASS")
          PY
          echo "WAREHOUSE_WORKSPACE_VISUAL_ISOLATION=PASS"

      - name: Verify Custom Reports suppression and backup-first cleanup
        run: |
          test -s apps/ndserp/ndserp/setup/custom_report_policy.py
          test -s apps/ndserp/ndserp/tests/test_custom_report_policy.py
          grep -Fq 'def patch_custom_report_section()' apps/ndserp/ndserp/setup/custom_report_policy.py
          grep -Fq 'desktop.Workspace.get_links = get_links_without_custom_reports' apps/ndserp/ndserp/setup/custom_report_policy.py
          grep -Fq 'NDS_FORCE_BENCH_RESTART=1 bash "$ROOT/codespace-start-server.sh"' codespace-poststart.sh
          grep -Fq 'def filter_custom_report_sections(' apps/ndserp/ndserp/setup/custom_report_policy.py
          grep -Fq 'def reject_nonstandard_report(' apps/ndserp/ndserp/setup/custom_report_policy.py
          grep -Fq 'def purge_nonstandard_reports()' apps/ndserp/ndserp/setup/custom_report_policy.py
          grep -Fq 'ndserp.setup.custom_report_policy.patch_custom_report_section' apps/ndserp/ndserp/hooks.py
          grep -Fq 'patch_custom_report_section()' apps/ndserp/ndserp/__init__.py
          grep -Fq 'ndserp.setup.custom_report_policy.reject_nonstandard_report' apps/ndserp/ndserp/hooks.py
          grep -Fq 'bash codespace-poststart.sh' .devcontainer/devcontainer.json
          grep -Fq 'bash "$ROOT/codespace-runtime-sync.sh" --once' codespace-poststart.sh
          grep -Fq 'bash "$ROOT/codespace-remove-custom-reports-safe.sh"' codespace-runtime-sync.sh
          grep -Fq 'LOCAL_DB_GUARD=PASS' codespace-remove-custom-reports-safe.sh
          grep -Fq 'NDS_CUSTOM_REPORT_PURGE=PASS' codespace-remove-custom-reports-safe.sh
          python3 -m py_compile apps/ndserp/ndserp/__init__.py apps/ndserp/ndserp/setup/custom_report_policy.py apps/ndserp/ndserp/tests/test_custom_report_policy.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path("codespace-remove-custom-reports-safe.sh").read_text(encoding="utf-8")
          backup = source.index('bench --site "$SITE" backup --with-files --compress --backup-path "$BACKUP_DIR"')
          purge = source.index('purge_nonstandard_reports')
          verify = source.index('COUNT_AFTER="$(count_reports)"')
          assert backup < purge < verify
          print("CUSTOM_REPORT_BACKUP_BEFORE_DELETE=PASS")
          print("CUSTOM_REPORT_PURGE_VERIFICATION=PASS")
          PY
          echo "CUSTOM_REPORT_POLICY_SOURCE=PASS"

      - name: Verify login language handoff
        run: |
          grep -q 'self.user_lang = get_language()' apps/frappe/frappe/auth.py
          grep -q 'frappe.local.lang = self.user_lang' apps/frappe/frappe/auth.py
          grep -q '"lang": str(frappe.local.lang)' apps/frappe/frappe/sessions.py
          grep -q 'self.data.data.get("lang")' apps/frappe/frappe/sessions.py
          grep -q 'args._lang = login.get_active_language()' apps/frappe/frappe/templates/includes/login/login.js
          grep -q 'login.with_active_language' apps/frappe/frappe/templates/includes/login/login.js
          echo "LOGIN_LANGUAGE_HANDOFF=PASS"

      - name: Verify Arabic login form labels
        run: |
          grep -q 'هل نسيت كلمة المرور؟' apps/frappe/frappe/www/login.html
          grep -q 'البريد الإلكتروني' apps/frappe/frappe/www/login.html
          grep -q 'كلمة المرور' apps/frappe/frappe/www/login.html
          grep -q 'متابعة' apps/frappe/frappe/www/login.html
          grep -q 'LOGIN_ARABIC_LABELS=PASS' runtime-refresh.sh
          grep -q 'login?_lang=ar' runtime-refresh.sh
          echo "LOGIN_ARABIC_LABELS_SOURCE=PASS"

      - name: Verify explicit login template language source
        run: |
          grep -Fq 'context["login_language"]' apps/frappe/frappe/www/login.py
          grep -Fq 'login_language == "ar"' apps/frappe/frappe/www/login.html
          grep -q 'login?_lang=ar' runtime-refresh.sh
          echo "LOGIN_TEMPLATE_LANGUAGE_SOURCE=PASS"



      - name: Verify Forgot Password visual isolation
        run: |
          grep -Fq 'function isForgotPasswordPage()' apps/amir_theme_v16/amir_theme_v16/src/js/core/login_brand.js
          grep -Fq 'if (isForgotPasswordPage())' apps/amir_theme_v16/amir_theme_v16/src/js/core/login_brand.js
          grep -Fq '.for-forgot {' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          grep -Fq 'align-items: center !important;' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          grep -Fq 'justify-content: center !important;' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          grep -Fq 'max-width: 400px !important;' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          echo "FORGOT_PASSWORD_UI_SOURCE=PASS"

      - name: Verify Email Login Link visual isolation
        run: |
          grep -Fq 'function isEmailLoginLinkPage()' apps/amir_theme_v16/amir_theme_v16/src/js/core/login_brand.js
          grep -Fq 'if (isEmailLoginLinkPage())' apps/amir_theme_v16/amir_theme_v16/src/js/core/login_brand.js
          grep -Fq 'for-login-with-email-link' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          grep -Fq 'form-login-with-email-link' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          grep -Fq 'max-width: 400px !important;' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          grep -Fq 'justify-content: center !important;' apps/amir_theme_v16/amir_theme_v16/src/scss/login_brand.bundle.scss
          grep -Fq 'for-login-with-email-link {{ visibility: hidden !important; }}' apps/amir_theme_v16/amir_theme_v16/website.py
          grep -Fq 'context.get("for_test") == "login.html"' apps/amir_theme_v16/amir_theme_v16/website.py
          echo "EMAIL_LOGIN_LINK_UI_SOURCE=PASS"



      - name: Verify Codespace site activation loop
        run: |
          grep -Fq 'bench --site "$SITE" install-app amir_theme_v16' codespace-bootstrap.sh
          grep -Fq "grep -Eq '^(Amir Theme|amir_theme_v16)([[:space:]]|$)'" codespace-bootstrap.sh
          grep -Fq "grep -Eq '^(Amir Theme|amir_theme_v16)([[:space:]]|$)'" codespace-runtime-sync.sh
          grep -Fq 'AMIR_THEME_SITE_DB_WRITE=BLOCKED' codespace-runtime-sync.sh
          grep -Fq 'SYNC_MODE="${NDS_RUNTIME_SYNC_ORIGIN_MODE:-${1:-loop}}"' codespace-runtime-sync.sh
          grep -Fq 'exec bash "$ROOT/codespace-runtime-sync.sh" --once' codespace-runtime-sync.sh
          grep -Fq 'SAFE_BOUNDARY=STOP_BEFORE_SITE_WRITE' codespace-runtime-sync.sh
          grep -Fq 'BENCH_APPS_REGISTRY=SYNCED' codespace-runtime-sync.sh
          grep -Fq 'ASSET_SERVE_TREE=PASS' codespace-bootstrap.sh
          grep -Fq 'ASSET_SERVE_TREE=PASS' codespace-runtime-sync.sh
          grep -Fq 'CORE_MODIFICATION=NO' codespace-bootstrap.sh
          grep -Fq 'CORE_MODIFICATION=NO' codespace-runtime-sync.sh
          grep -Fq 'MIGRATION=NO' codespace-bootstrap.sh
          grep -Fq 'MIGRATION=NO' codespace-runtime-sync.sh
          echo "CODESPACE_SITE_ACTIVATION_LOOP=PASS"

      - name: Verify Accounts UI activation is independent of optional DB cleanup
        run: |
          grep -Fq 'CUSTOM_REPORT_CLEANUP=NOT_REQUIRED_FOR_UI_SYNC' codespace-poststart.sh
          ! grep -Fq 'if [ ! -s "$ROOT/sites/.nds-custom-report-cleanup-v1" ]' codespace-poststart.sh
          grep -Fq 'if [ "${NDS_CLEANUP_CUSTOM_REPORTS:-0}" = "1" ]' codespace-runtime-sync.sh
          grep -Fq '@import "components/accounts-workspace";' apps/amir_theme_v16/amir_theme_v16/src/scss/amir_theme.bundle.scss
          grep -Fq 'try { syncAccountsWorkspaceScope(); }' apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js
          grep -Eq 'if \(?key == "amir_theme.bundle.css"\)?:' codespace-runtime-sync.sh
          grep -Fq 'SERVED_ACCOUNTS_WORKSPACE_CSS=PASS' codespace-verify-runtime.sh
          grep -Fq 'SERVED_ACCOUNTS_WORKSPACE_JS=PASS' codespace-verify-runtime.sh
          echo "ACCOUNTS_UI_ACTIVATION_INDEPENDENT_OF_DB_CLEANUP=PASS"

      - name: Verify backup-first local theme installation flow
        run: |
          grep -Fq 'ROOT="/workspaces/ndserp-sa"' codespace-install-theme-safe.sh
          grep -Fq 'SITE="ndserpsa.nds-sa.com"' codespace-install-theme-safe.sh
          grep -Fq 'LOCAL_DB_GUARD=PASS' codespace-install-theme-safe.sh
          grep -Fq 'bench --site "$SITE" backup --with-files --compress --backup-path "$BACKUP_DIR"' codespace-install-theme-safe.sh
          grep -Fq 'bench --site "$SITE" install-app amir_theme_v16' codespace-install-theme-safe.sh
          grep -Fq "grep -Eq '^(Amir Theme|amir_theme_v16)([[:space:]]|$)'" codespace-install-theme-safe.sh
          grep -Fq 'bench build --app amir_theme_v16 --production' codespace-install-theme-safe.sh
          grep -Fq 'bash codespace-verify-runtime.sh' codespace-install-theme-safe.sh
          grep -Fq 'PRODUCTION_DB_WRITE=NO' codespace-install-theme-safe.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path("codespace-install-theme-safe.sh").read_text(encoding="utf-8")
          backup = source.index('backup --with-files --compress --backup-path "$BACKUP_DIR"')
          install = source.index('install-app amir_theme_v16')
          build = source.index('bench build --app amir_theme_v16 --production')
          verify = source.index('bash codespace-verify-runtime.sh')
          assert backup < install < build < verify
          print("BACKUP_BEFORE_INSTALL=PASS")
          print("INSTALL_BEFORE_BUILD=PASS")
          print("BUILD_BEFORE_RUNTIME_VERIFY=PASS")
          PY
          echo "LOCAL_THEME_INSTALL_GUARD=PASS"

      - name: Verify modern Desk header and built-CSS guard
        run: |
          test -s apps/amir_theme_v16/amir_theme_v16/src/scss/components/_modern-header.scss
          grep -Fq '@import "components/modern-header";' apps/amir_theme_v16/amir_theme_v16/src/scss/amir_theme.bundle.scss
          grep -Fq 'min-height: 58px;' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_modern-header.scss
          grep -Fq 'background: #ffffff;' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_modern-header.scss
          grep -Fq 'color: #0a2342;' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_modern-header.scss
          grep -Fq 'prefers-reduced-motion: reduce' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_modern-header.scss
          grep -Fq 'MODERN_HEADER_CSS=PASS' codespace-runtime-sync.sh
          grep -Fq 'required_header_markers = ("body .navbar", "58px", "#0a2342")' codespace-runtime-sync.sh
          grep -Fq 'required_header_markers = ("body .navbar", "58px", "#0a2342")' codespace-bootstrap.sh
          grep -Fq "for marker in 'body .navbar' '58px' '#0a2342'; do" codespace-verify-runtime.sh
          grep -Fq 'MODERN_HEADER_CSS=FAIL:MISSING_MARKERS:' codespace-runtime-sync.sh
          grep -Fq 'SERVED_HEADER_CSS=PASS' codespace-verify-runtime.sh
          grep -Fq 'HEADER_RUNTIME_VERIFICATION=PASS' codespace-verify-runtime.sh
          grep -Fq 'root / "sites" / rel.lstrip("/")' codespace-runtime-sync.sh
          grep -Fq 'root / "sites" / rel.lstrip("/")' codespace-bootstrap.sh
          grep -Fq 'BENCH_SERVER=PASS' codespace-start-server.sh
          grep -Fq 'bash "$ROOT/codespace-start-server.sh"' codespace-poststart.sh
          grep -Fq 'sudo service mariadb start' codespace-poststart.sh
          grep -Fq 'bash "$ROOT/codespace-verify-runtime.sh"' codespace-poststart.sh
          echo "MODERN_HEADER_RUNTIME_VERIFICATION=PASS"
          echo "MODERN_HEADER_SOURCE=PASS"
          echo "MODERN_HEADER_IMPORT=PASS"
          echo "MODERN_HEADER_RUNTIME_GUARD=PASS"

      - name: Verify accounts workspace visual isolation and asset gates
        run: |
          test -s apps/amir_theme_v16/amir_theme_v16/src/scss/components/_accounts-workspace.scss
          grep -Fq '@import "components/accounts-workspace";' apps/amir_theme_v16/amir_theme_v16/src/scss/amir_theme.bundle.scss
          grep -Fq 'function syncAccountsWorkspaceScope()' apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js
          grep -Fq 'try { syncAccountsWorkspaceScope(); }' apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js
          grep -Fq 'grid-template-columns: repeat(12, minmax(0, 1fr));' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_accounts-workspace.scss
          grep -Fq 'ACCOUNTS_WORKSPACE_CSS=PASS' codespace-runtime-sync.sh
          grep -Fq 'ACCOUNTS_WORKSPACE_JS=PASS' codespace-runtime-sync.sh
          grep -Fq 'SERVED_ACCOUNTS_WORKSPACE_CSS=PASS' codespace-verify-runtime.sh
          grep -Fq 'SERVED_ACCOUNTS_WORKSPACE_JS=PASS' codespace-verify-runtime.sh
          echo "ACCOUNTS_WORKSPACE_SOURCE=PASS"

      - name: Verify purchase workspace source and served-asset gates
        run: |
          grep -Fq 'body.nds-purchase-workspace-redesign #page-Workspaces' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_sales-workspace-redesign.scss
          grep -Fq -- '--nds-purchase-blue: #C58B3C;' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_sales-workspace-redesign.scss
          grep -Fq 'grid-column: span 7;' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_sales-workspace-redesign.scss
          grep -Fq 'grid-column: span 5;' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_sales-workspace-redesign.scss
          grep -Fq 'border-collapse: separate;' apps/amir_theme_v16/amir_theme_v16/src/scss/components/_sales-workspace-redesign.scss
          grep -Fq '@import "components/sales-workspace-redesign";' apps/amir_theme_v16/amir_theme_v16/src/scss/amir_theme.bundle.scss
          grep -Fq 'function syncPurchaseWorkspaceScope()' apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js
          grep -Fq 'try { syncPurchaseWorkspaceScope(); }' apps/amir_theme_v16/amir_theme_v16/src/js/core/workspace_enhance.js
          grep -Fq 'PURCHASE_WORKSPACE_CSS=PASS' codespace-runtime-sync.sh
          grep -Fq 'PURCHASE_WORKSPACE_JS=PASS' codespace-runtime-sync.sh
          grep -Fq 'SERVED_PURCHASE_WORKSPACE_CSS=PASS' codespace-verify-runtime.sh
          grep -Fq 'SERVED_PURCHASE_WORKSPACE_JS=PASS' codespace-verify-runtime.sh
          echo "PURCHASE_WORKSPACE_SOURCE_AND_ASSET_GATES=PASS"

      - name: Verify Quick Actions infinite horizontal marquee
        run: |
          grep -Fq 'const speed = 24;' apps/amir_theme_v16/amir_theme_v16/src/js/core/desk_quick_actions.js
          grep -Fq 'data-amt-quick-actions-loop' apps/amir_theme_v16/amir_theme_v16/src/js/core/desk_quick_actions.js
          grep -Fq 'amt-quick-action-clone' apps/amir_theme_v16/amir_theme_v16/src/js/core/desk_quick_actions.js
          grep -Fq 'offset = (offset + speed * elapsed) % cycleWidth;' apps/amir_theme_v16/amir_theme_v16/src/js/core/desk_quick_actions.js
          ! grep -Fq 'direction = -1' apps/amir_theme_v16/amir_theme_v16/src/js/core/desk_quick_actions.js
          grep -Fq 'margin-inline: 0;' apps/amir_theme_v16/amir_theme_v16/src/scss/layouts/_desk-quick-actions.scss
          grep -Fq 'data-amt-quick-actions-loop' codespace-runtime-sync.sh
          grep -Fq 'amt-quick-action-clone' codespace-runtime-sync.sh
          grep -Fq 'data-amt-quick-actions-loop' codespace-verify-runtime.sh
          grep -Fq 'amt-quick-action-clone' codespace-verify-runtime.sh
          echo "QUICK_ACTIONS_INFINITE_MARQUEE_SOURCE=PASS"

      - name: Git whitespace check
        run: git diff --check
